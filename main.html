<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>운동 시작</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:"Arial", sans-serif;
    background:linear-gradient(#e0f7ff,#ffffff);
}


/* 상단 */
header{
    background:linear-gradient(135deg,#0077ff,#00d4ff);
    color:white;
    text-align:center;
    padding:45px;
}

header h1{
    font-size:45px;
}

header p{
    margin-top:15px;
    font-size:20px;
}


/* 메뉴 */
nav{
    background:#222;
    padding:15px;
    text-align:center;
}

nav a{
    color:white;
    text-decoration:none;
    margin:20px;
    font-size:18px;
}

nav a:hover{
    color:#00d4ff;
}


/* 메인 */
.container{
    width:85%;
    margin:40px auto;
    background:white;
    padding:40px;
    border-radius:25px;
    box-shadow:0 10px 25px rgba(0,0,0,0.15);
    text-align:center;
}


.container h2{
    color:#0077ff;
    font-size:35px;
    margin-bottom:30px;
}


/* 운동 카드 */
.exercise{
    display:flex;
    justify-content:center;
    gap:25px;
    flex-wrap:wrap;
}


.box{
    width:260px;
    background:#f5fbff;
    padding:25px;
    border-radius:20px;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
    transition:0.3s;
}


.box:hover{
    transform:translateY(-10px);
    background:#e6f7ff;
}


.box h3{
    color:#0077ff;
    font-size:23px;
    margin-bottom:15px;
}


.box p{
    line-height:1.8;
}


.box b{
    color:#ff6600;
    font-size:18px;
}


hr{
    border:0;
    height:2px;
    background:#ddd;
    margin:15px 0;
}


/* 시작 버튼 */
button{
    margin-top:40px;
    padding:15px 40px;
    border:none;
    border-radius:30px;
    background:#0077ff;
    color:white;
    font-size:20px;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}


button:hover{
    background:#0055bb;
    transform:scale(1.1);
}


/* 아래 */
footer{
    background:#222;
    color:white;
    text-align:center;
    padding:20px;
    margin-top:50px;
}

</style>

</head>


<body>


<header>
    <h1>🔥 오늘의 운동 🔥</h1>
    <p>건강한 몸을 위한 하루 30분 운동</p>
</header>


<nav>
    <a href="#">🏠 홈</a>
    <a href="#">💪 운동</a>
    <a href="#">📅 계획</a>
    <a href="#">⭐ 목표</a>
</nav>



<div class="container">

<h2>🏋️ 오늘의 운동 계획</h2>


<div class="exercise">


<div class="box">
<h3>🏃 유산소 운동</h3>

<p>
달리기<br>
걷기<br>
줄넘기
</p>

<hr>

<b>운동량</b><br>
달리기 20분<br>
걷기 20분<br>
줄넘기 100회

</div>



<div class="box">
<h3>💪 근력 운동</h3>

<p>
팔굽혀펴기<br>
스쿼트<br>
윗몸일으키기
</p>

<hr>

<b>운동량</b><br>
팔굽혀펴기 15회 × 3세트<br>
스쿼트 20회 × 3세트<br>
윗몸일으키기 20회 × 3세트

</div>



<div class="box">
<h3>🧘 스트레칭</h3>

<p>
목 스트레칭<br>
다리 스트레칭<br>
전신 스트레칭
</p>

<hr>

<b>운동량</b><br>
각 동작 30초 유지<br>
총 10분 진행

</div>


</div>


<button onclick="alert('운동 시작! 오늘도 화이팅 💪')">
운동 시작하기
</button>


</div>



<footer>
© 2026 운동 홈페이지 | 건강한 습관 만들기
</footer>


</body>
</html>
