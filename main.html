<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>운동 시작</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#f0f8ff;
}

header{
    background:linear-gradient(90deg,#0077ff,#00c6ff);
    color:white;
    text-align:center;
    padding:30px;
}

.container{
    width:80%;
    margin:40px auto;
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 0 15px gray;
    text-align:center;
}

h2{
    color:#0077ff;
}

.exercise{
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
}

.box{
    width:200px;
    padding:20px;
    background:#e8f4ff;
    border-radius:10px;
}

.box h3{
    color:#0077ff;
}

button{
    background:#0077ff;
    color:white;
    border:none;
    padding:12px 25px;
    border-radius:20px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#0056cc;
}

footer{
    background:#222;
    color:white;
    text-align:center;
    padding:15px;
}
</style>

</head>

<body>

<header>
    <h1>🏋️ 운동을 시작해볼까요?</h1>
    <p>건강한 몸을 위한 첫 번째 단계</p>
</header>


<div class="container">

    <h2>오늘의 운동</h2>

    <div class="exercise">

        <div class="box">
            <h3>🏃 유산소 운동</h3>
            <p>달리기<br>걷기<br>줄넘기</p>
        </div>

        <div class="box">
            <h3>💪 근력 운동</h3>
            <p>팔굽혀펴기<br>스쿼트<br>윗몸일으키기</p>
        </div>

        <div class="box">
            <h3>🧘 스트레칭</h3>
            <p>몸 풀기<br>유연성 향상</p>
        </div>

    </div>

    <br><br>

    <h2>🔥 오늘도 화이팅!</h2>

    <button onclick="alert('운동 시작! 화이팅 💪')">
        운동 시작
    </button>

</div>


<footer>
    © 2026 운동 홈페이지
</footer>

</body>
</html>
