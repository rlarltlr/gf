<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>FPS 메인</title>

<style>

body{
    margin:0;
    background:#111;
    color:white;
    font-family:Arial;
}


header{
    background:linear-gradient(90deg,#ff0000,#ff9900);
    text-align:center;
    padding:30px;
}


.container{
    width:85%;
    margin:40px auto;
    background:#222;
    padding:40px;
    border-radius:20px;
    text-align:center;
}


h2{
    color:#ff9900;
}


button{
    padding:15px 30px;
    background:#ff3300;
    color:white;
    border:none;
    border-radius:20px;
    font-size:18px;
    cursor:pointer;
}


.card{
    display:inline-block;
    width:250px;
    margin:15px;
    padding:20px;
    background:#333;
    border-radius:15px;
}


.card h3{
    color:#00ccff;
}


footer{
    background:#000;
    text-align:center;
    padding:20px;
}

</style>

</head>


<body>


<header>

<h1>🔥 지진 FPS 전투</h1>

<p>최후까지 살아남아라!</p>

</header>



<div class="container">


<h2>🌋 게임 기능</h2>


<button onclick="earthquake()">
🌋 지진 모델링
</button>



<h2>🧑 캐릭터 기술</h2>


<div class="card">

<h3>🔫 총쏘기</h3>

<p>
원거리 공격<br>
적에게 피해를 줌<br>
탄약 관리 필요
</p>

</div>



<div class="card">

<h3>💨 돌진</h3>

<p>
빠른 이동<br>
적에게 접근<br>
공격 회피 가능
</p>

</div>



<h2>👾 적 종류</h2>


<div class="card">

<h3>🏹 활 적</h3>

<p>
멀리서 공격<br>
빠른 이동
</p>

</div>



<div class="card">

<h3>⚔ 칼 적</h3>

<p>
근접 공격<br>
강한 데미지
</p>

</div>


</div>



<footer>

© 2026 지진 FPS GAME

</footer>



<script>

function earthquake(){

alert("🌋 지진 발생! 맵이 흔들립니다!");

}

</script>


</body>
</html>
