<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">
<title>3D 전투기 슈팅</title>

<style>

body{
    margin:0;
    overflow:hidden;
    background:black;
}

#ui{
    position:absolute;
    top:20px;
    left:20px;
    color:white;
    font-size:25px;
    z-index:5;
}

</style>

</head>


<body>


<div id="ui">

❤️ HP : <span id="hp">100</span>

<br>

🏆 점수 : <span id="score">0</span>

<br>

🔫 연사 : 마우스 클릭 유지

</div>



<script src="https://cdn.jsdelivr.net/npm/three@0.160/build/three.min.js"></script>



<script>


// =================
// 기본 설정
// =================


const scene =
new THREE.Scene();


scene.background =
new THREE.Color(0x3399ff);



const camera =
new THREE.PerspectiveCamera(
70,
innerWidth/innerHeight,
0.1,
1000
);



const renderer =
new THREE.WebGLRenderer();


renderer.setSize(
innerWidth,
innerHeight
);


document.body.appendChild(renderer.domElement);





// =================
// 조명
// =================


let light =
new THREE.DirectionalLight(
0xffffff,
2
);


light.position.set(
0,10,5
);


scene.add(light);





// =================
// 바닥
// =================


let ground =
new THREE.Mesh(

new THREE.PlaneGeometry(
200,
200
),

new THREE.MeshPhongMaterial({

color:0x226622

})

);


ground.rotation.x=-Math.PI/2;

scene.add(ground);





// =================
// 전투기 생성
// =================


function createPlane(color){


let plane =
new THREE.Group();


// 몸체

let body =
new THREE.Mesh(

new THREE.ConeGeometry(
0.6,
3,
8
),

new THREE.MeshPhongMaterial({
color:color
})

);


body.rotation.x=Math.PI/2;


plane.add(body);



// 날개

let wing =
new THREE.Mesh(

new THREE.BoxGeometry(
3,
0.1,
0.7
),

new THREE.MeshPhongMaterial({
color:color
})

);


plane.add(wing);



return plane;


}




// 플레이어


let player =
createPlane(0x00ffff);


scene.add(player);


player.position.set(
0,
2,
10
);





camera.position.set(
0,
5,
15
);


camera.lookAt(player.position);






// =================
// 적
// =================


let enemies=[];


function makeEnemy(){


let e =
createPlane(0xff0000);


e.position.set(

(Math.random()-0.5)*20,

3,

-50

);


scene.add(e);


enemies.push(e);


}



// 적 수 줄임

setInterval(()=>{


if(enemies.length<3){

makeEnemy();

}


},3000);







// =================
// 총알
// =================


let bullets=[];


let firing=false;


document.addEventListener(
"mousedown",
()=>{

firing=true;

});


document.addEventListener(
"mouseup",
()=>{

firing=false;

});



function shoot(){


let bullet =
new THREE.Mesh(

new THREE.SphereGeometry(
0.08
),

new THREE.MeshBasicMaterial({
color:"yellow"
})

);



bullet.position.copy(
player.position
);



bullet.velocity =
new THREE.Vector3(
0,
0,
-1
);



scene.add(bullet);


bullets.push(bullet);


}





// 연사

setInterval(()=>{


if(firing){

shoot();

}


},120);







// =================
// 이동
// =================


let keys={};


onkeydown=e=>{

keys[e.key]=true;

};


onkeyup=e=>{

keys[e.key]=false;

};




let score=0;

let hp=100;




// =================
// 게임 반복
// =================


function animate(){


requestAnimationFrame(
animate
);




// 이동


if(keys.ArrowLeft)

player.position.x-=0.2;


if(keys.ArrowRight)

player.position.x+=0.2;


if(keys.ArrowUp)

player.position.y+=0.2;


if(keys.ArrowDown)

player.position.y-=0.2;





// 총알 이동


bullets.forEach((b,i)=>{


b.position.z-=1;



if(b.position.z<-100){

scene.remove(b);

}



enemies.forEach((e,j)=>{


if(
b.position.distanceTo(e.position)<1
){


scene.remove(e);

scene.remove(b);


enemies.splice(j,1);


score++;


document.getElementById("score")
.innerHTML=score;


}



});


});




// 적 이동


enemies.forEach(e=>{


e.position.z+=0.1;



// 충돌


if(
e.position.distanceTo(player.position)<2
){


hp-=1;


document.getElementById("hp")
.innerHTML=Math.floor(hp);


}



});





renderer.render(
scene,
camera
);


}


animate();



</script>


</body>

</html>
