<!DOCTYPE html>

<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>전투기 슈팅 게임</title>

<style>
body{
    margin:0;
    overflow:hidden;
    background:#87ceeb;
}

canvas{
    display:block;
    background:linear-gradient(#6ec6ff,#b3ecff);
}

#hud{
    position:absolute;
    top:10px;
    left:10px;
    color:white;
    font-size:24px;
    font-family:Arial,sans-serif;
    text-shadow:2px 2px 4px rgba(0,0,0,0.5);
}
</style>

</head>

<body>

<div id="hud">점수: 0 | HP: 5</div>
<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let score = 0;
let hp = 5;

const player = {
    x: canvas.width/2,
    y: canvas.height-80,
    w: 40,
    h: 60,
    speed: 6
};

let bullets = [];
let enemies = [];
let keys = {};
let shooting = false;

window.addEventListener("keydown",e=>keys[e.key]=true);
window.addEventListener("keyup",e=>keys[e.key]=false);

window.addEventListener("mousedown",()=>shooting=true);
window.addEventListener("mouseup",()=>shooting=false);

function shoot(){
    bullets.push({
        x: player.x,
        y: player.y-20,
        r:4
    });
}

setInterval(()=>{
    if(shooting) shoot();
},100);

function spawnEnemy(){
    enemies.push({
        x:Math.random()*(canvas.width-40)+20,
        y:-20,
        w:35,
        h:45,
        speed:2+Math.random()*3
    });
}

setInterval(()=>{
    const count = Math.floor(Math.random()*3)+2;
    for(let i=0;i<count;i++) spawnEnemy();
},250);

function update(){

    if(keys["ArrowLeft"]) player.x-=player.speed;
    if(keys["ArrowRight"]) player.x+=player.speed;
    if(keys["ArrowUp"]) player.y-=player.speed;
    if(keys["ArrowDown"]) player.y+=player.speed;

    player.x=Math.max(20,Math.min(canvas.width-20,player.x));
    player.y=Math.max(30,Math.min(canvas.height-30,player.y));

    for(let i=bullets.length-1;i>=0;i--){
        bullets[i].y-=10;
        if(bullets[i].y<0) bullets.splice(i,1);
    }

    for(let i=enemies.length-1;i>=0;i--){
        enemies[i].y+=enemies[i].speed;

        if(enemies[i].y>canvas.height+50){
            enemies.splice(i,1);
            hp--;
            continue;
        }

        if(
            Math.abs(enemies[i].x-player.x)<30 &&
            Math.abs(enemies[i].y-player.y)<40
        ){
            enemies.splice(i,1);
            hp--;
            continue;
        }

        for(let j=bullets.length-1;j>=0;j--){
            if(
                Math.abs(bullets[j].x-enemies[i].x)<20 &&
                Math.abs(bullets[j].y-enemies[i].y)<25
            ){
                bullets.splice(j,1);
                enemies.splice(i,1);
                score+=10;
                break;
            }
        }
    }

    document.getElementById("hud").innerText =
        `점수: ${score} | HP: ${hp}`;

    if(hp<=0){
        alert(`게임 오버!\\n최종 점수: ${score}`);
        location.reload();
    }
}

function draw(){

    ctx.clearRect(0,0,canvas.width,canvas.height);

    ctx.fillStyle="blue";
    ctx.beginPath();
    ctx.moveTo(player.x,player.y-30);
    ctx.lineTo(player.x-20,player.y+20);
    ctx.lineTo(player.x,player.y+10);
    ctx.lineTo(player.x+20,player.y+20);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle="yellow";
    bullets.forEach(b=>{
        ctx.beginPath();
        ctx.arc(b.x,b.y,b.r,0,Math.PI*2);
        ctx.fill();
    });

    ctx.fillStyle="red";
    enemies.forEach(e=>{
        ctx.beginPath();
        ctx.moveTo(e.x,e.y+20);
        ctx.lineTo(e.x-18,e.y-20);
        ctx.lineTo(e.x,e.y-10);
        ctx.lineTo(e.x+18,e.y-20);
        ctx.closePath();
        ctx.fill();
    });

}

function gameLoop(){
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>

</body>
</html>
