<!DOCTYPE html>

<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>3D 전투기 슈팅 - Chase Camera</title>
<style>
body{
    margin:0;
    overflow:hidden;
    background:#000;
}
#hud{
    position:absolute;
    top:10px;
    left:10px;
    color:white;
    font:22px Arial;
    z-index:10;
    text-shadow:0 0 8px black;
}
</style>
</head>
<body>

<div id="hud">점수: 0 | HP: 5</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160/build/three.module.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);

// 카메라
const camera = new THREE.PerspectiveCamera(
    75,
    window.innerWidth/window.innerHeight,
    0.1,
    2000
);

camera.position.set(0,2,10);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

// 조명
const light = new THREE.DirectionalLight(0xffffff,1.2);
light.position.set(10,20,10);
light.castShadow = true;
scene.add(light);

scene.add(new THREE.AmbientLight(0xffffff,0.6));

// 바닥
const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(200,4000),
    new THREE.MeshPhongMaterial({color:0x2e7d32})
);
floor.rotation.x = -Math.PI/2;
floor.position.y = -1.5;
floor.position.z = -1800;
floor.receiveShadow = true;
scene.add(floor);

// 플레이어
const player = new THREE.Group();

const body = new THREE.Mesh(
    new THREE.ConeGeometry(0.4,1.8,16),
    new THREE.MeshPhongMaterial({color:0x1565c0})
);
body.rotation.x = Math.PI/2;
body.castShadow = true;

const wing = new THREE.Mesh(
    new THREE.BoxGeometry(2.2,0.08,0.5),
    new THREE.MeshPhongMaterial({color:0x90caf9})
);
wing.castShadow = true;

player.add(body);
player.add(wing);

player.position.set(0,0,6);

scene.add(player);

// 총알
const bullets = [];

// 적
const enemies = [];

let score = 0;
let hp = 5;

const hud = document.getElementById('hud');

// 입력
const keys = {};
window.addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);
window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

let shooting=false;
window.addEventListener('mousedown',()=>shooting=true);
window.addEventListener('mouseup',()=>shooting=false);

// 총알 생성
function createBullet(){

    const b = new THREE.Mesh(
        new THREE.SphereGeometry(0.08,8,8),
        new THREE.MeshBasicMaterial({color:0xffff00})
    );

    b.position.copy(player.position);
    b.position.y += 0.2;
    b.position.z -= 1;

    scene.add(b);
    bullets.push(b);

}

setInterval(()=>{
    if(shooting) createBullet();
},120);

// 적 생성
function createEnemy(){

    const e = new THREE.Group();

    const body = new THREE.Mesh(
        new THREE.ConeGeometry(0.35,1.4,16),
        new THREE.MeshPhongMaterial({color:0xd32f2f})
    );
    body.rotation.x = -Math.PI/2;
    body.castShadow = true;

    const wing = new THREE.Mesh(
        new THREE.BoxGeometry(1.8,0.06,0.4),
        new THREE.MeshPhongMaterial({color:0xef9a9a})
    );
    wing.castShadow = true;

    e.add(body);
    e.add(wing);

    // 플레이어 앞쪽 먼 거리에서 등장
    e.position.set(
        player.position.x + (Math.random()-0.5)*10,
        player.position.y + (Math.random()-0.5)*4,
        player.position.z - 80
    );

    scene.add(e);
    enemies.push(e);

}

// 적 수를 적당히 유지
setInterval(createEnemy,900);

// 업데이트
function update(){

    const speed = 0.22;

    // 앞으로 계속 비행
    player.position.z -= 0.18;

    if(keys['arrowleft'] || keys['a']) player.position.x -= speed;
    if(keys['arrowright'] || keys['d']) player.position.x += speed;
    if(keys['arrowup'] || keys['w']) player.position.y += speed;
    if(keys['arrowdown'] || keys['s']) player.position.y -= speed;

    player.position.x = Math.max(-8,Math.min(8,player.position.x));
    player.position.y = Math.max(-4,Math.min(4,player.position.y));

    // 총알
    for(let i=bullets.length-1;i>=0;i--){

        bullets[i].position.z -= 1.2;

        if(bullets[i].position.z < player.position.z - 120){
            scene.remove(bullets[i]);
            bullets.splice(i,1);
        }

    }

    // 적
    for(let i=enemies.length-1;i>=0;i--){

        // 플레이어를 향해 돌진
        enemies[i].position.z += 0.45;

        // 플레이어를 지나가면 HP 감소
        if(enemies[i].position.z > player.position.z + 6){
            scene.remove(enemies[i]);
            enemies.splice(i,1);
            hp--;
            continue;
        }

        // 플레이어 충돌
        if(enemies[i].position.distanceTo(player.position) < 1.0){
            scene.remove(enemies[i]);
            enemies.splice(i,1);
            hp--;
            continue;
        }

        // 총알 충돌
        for(let j=bullets.length-1;j>=0;j--){

            if(enemies[i].position.distanceTo(bullets[j].position) < 0.8){

                scene.remove(enemies[i]);
                scene.remove(bullets[j]);

                enemies.splice(i,1);
                bullets.splice(j,1);

                score += 10;
                break;

            }

        }

    }

    hud.textContent = `점수: ${score} | HP: ${hp}`;

    if(hp<=0){
        alert(`게임 오버! 최종 점수: ${score}`);
        location.reload();
    }

}

// 카메라 추적
function updateCamera(){

    const target = new THREE.Vector3(
        player.position.x,
        player.position.y + 2,
        player.position.z + 8
    );

    // 부드럽게 따라가기
    camera.position.lerp(target,0.08);

    // 플레이어 앞을 바라보기
    camera.lookAt(
        player.position.x,
        player.position.y,
        player.position.z - 20
    );

}

// 렌더 루프
function animate(){

    requestAnimationFrame(animate);

    update();
    updateCamera();

    renderer.render(scene,camera);

}

animate();

// 리사이즈
window.addEventListener('resize',()=>{

    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth,window.innerHeight);

});
</script>

</body>
</html>
