<!DOCTYPE html>

<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>3D 전투기 슈팅</title>
<style>
body{
    margin:0;
    overflow:hidden;
    background:#000;
}
#hud{
    position:absolute;
    top:10px;
    left:10px;
    color:white;
    font:22px Arial;
    z-index:10;
    text-shadow:0 0 8px black;
}
</style>
</head>
<body>

<div id="hud">점수: 0 | HP: 5</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160/build/three.module.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);

const camera = new THREE.PerspectiveCamera(
    75,
    window.innerWidth/window.innerHeight,
    0.1,
    1000
);

camera.position.set(0,5,12);
camera.lookAt(0,0,0);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth,window.innerHeight);
document.body.appendChild(renderer.domElement);

// 조명
const light = new THREE.DirectionalLight(0xffffff,1.2);
light.position.set(5,10,5);
scene.add(light);
scene.add(new THREE.AmbientLight(0xffffff,0.6));

// 바닥
const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(40,80),
    new THREE.MeshPhongMaterial({color:0x228b22})
);
floor.rotation.x = -Math.PI/2;
floor.position.y = -1;
scene.add(floor);

// 플레이어
const player = new THREE.Group();

const body = new THREE.Mesh(
    new THREE.ConeGeometry(0.35,1.5,16),
    new THREE.MeshPhongMaterial({color:0x1565c0})
);
body.rotation.x = Math.PI/2;

const wing = new THREE.Mesh(
    new THREE.BoxGeometry(1.8,0.05,0.4),
    new THREE.MeshPhongMaterial({color:0x90caf9})
);

player.add(body);
player.add(wing);
player.position.set(0,0,-5);
scene.add(player);

// 총알
const bullets = [];

// 적
const enemies = [];

let score = 0;
let hp = 5;

const hud = document.getElementById('hud');

const keys = {};
window.addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);
window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

let shooting=false;
window.addEventListener('mousedown',()=>shooting=true);
window.addEventListener('mouseup',()=>shooting=false);

function createBullet(){

    const b = new THREE.Mesh(
        new THREE.SphereGeometry(0.08,8,8),
        new THREE.MeshBasicMaterial({color:0xffff00})
    );

    b.position.copy(player.position);
    b.position.y += 0.2;

    scene.add(b);
    bullets.push(b);

}

setInterval(()=>{
    if(shooting) createBullet();
},120);

function createEnemy(){

    const e = new THREE.Group();

    const body = new THREE.Mesh(
        new THREE.ConeGeometry(0.35,1.3,16),
        new THREE.MeshPhongMaterial({color:0xd32f2f})
    );
    body.rotation.x = -Math.PI/2;

    const wing = new THREE.Mesh(
        new THREE.BoxGeometry(1.6,0.05,0.35),
        new THREE.MeshPhongMaterial({color:0xef9a9a})
    );

    e.add(body);
    e.add(wing);

    e.position.set(
        (Math.random()-0.5)*10,
        0,
        18
    );

    scene.add(e);
    enemies.push(e);

}

// 적 수를 줄임
setInterval(createEnemy,900);

function update(){

    const speed = 0.18;

    if(keys['arrowleft'] || keys['a']) player.position.x -= speed;
    if(keys['arrowright'] || keys['d']) player.position.x += speed;
    if(keys['arrowup'] || keys['w']) player.position.z -= speed;
    if(keys['arrowdown'] || keys['s']) player.position.z += speed;

    player.position.x = Math.max(-8,Math.min(8,player.position.x));
    player.position.z = Math.max(-8,Math.min(6,player.position.z));

    // 총알
    for(let i=bullets.length-1;i>=0;i--){

        bullets[i].position.z -= 0.6;

        if(bullets[i].position.z < -20){
            scene.remove(bullets[i]);
            bullets.splice(i,1);
        }

    }

    // 적
    for(let i=enemies.length-1;i>=0;i--){

        enemies[i].position.z -= 0.08;

        if(enemies[i].position.z < -12){
            scene.remove(enemies[i]);
            enemies.splice(i,1);
            hp--;
            continue;
        }

        // 충돌
        if(enemies[i].position.distanceTo(player.position) < 0.8){
            scene.remove(enemies[i]);
            enemies.splice(i,1);
            hp--;
            continue;
        }

        // 총알 충돌
        for(let j=bullets.length-1;j>=0;j--){

            if(enemies[i].position.distanceTo(bullets[j].position) < 0.7){

                scene.remove(enemies[i]);
                scene.remove(bullets[j]);

                enemies.splice(i,1);
                bullets.splice(j,1);

                score += 10;
                break;

            }

        }

    }

    hud.textContent = `점수: ${score} | HP: ${hp}`;

    if(hp<=0){
        alert(`게임 오버! 최종 점수: ${score}`);
        location.reload();
    }

}

function animate(){

    requestAnimationFrame(animate);

    update();

    renderer.render(scene,camera);

}

animate();

window.addEventListener('resize',()=>{

    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth,window.innerHeight);

});
</script>

</body>
</html>
