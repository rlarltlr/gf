<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>비행기 슈팅 게임</title>

<style>
body{
    margin:0;
    overflow:hidden;
    background:#87ceeb;
}

canvas{
    display:block;
}

#score{
    position:absolute;
    top:20px;
    left:20px;
    color:white;
    font-size:25px;
    font-family:Arial;
}
</style>

</head>

<body>

<div id="score">
점수 : 0
</div>


<canvas id="game"></canvas>


<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");


canvas.width=window.innerWidth;
canvas.height=window.innerHeight;



let score=0;


// 플레이어 비행기

let plane={

x:canvas.width/2,
y:canvas.height-100,
speed:7

};



// 총알

let bullets=[];


// 적

let enemies=[];


// 키

let keys={};


document.addEventListener("keydown",e=>{
keys[e.key]=true;
});


document.addEventListener("keyup",e=>{
keys[e.key]=false;
});




// 총 발사

document.addEventListener("keydown",e=>{

if(e.key==" "){


bullets.push({

x:plane.x,
y:plane.y-30

});


}

});





// 적 생성

setInterval(()=>{


enemies.push({

x:Math.random()*canvas.width,
y:-50,
speed:3

});


},1000);





function update(){


// 이동

if(keys["ArrowLeft"])
plane.x-=plane.speed;


if(keys["ArrowRight"])
plane.x+=plane.speed;


if(keys["ArrowUp"])
plane.y-=plane.speed;


if(keys["ArrowDown"])
plane.y+=plane.speed;



// 총알 이동

bullets.forEach((b,i)=>{


b.y-=10;


if(b.y<0)
bullets.splice(i,1);


});




// 적 이동

enemies.forEach((e,i)=>{


e.y+=e.speed;



if(e.y>canvas.height)
enemies.splice(i,1);




// 충돌

bullets.forEach((b,bi)=>{


if(
Math.abs(b.x-e.x)<30 &&
Math.abs(b.y-e.y)<30
){


enemies.splice(i,1);

bullets.splice(bi,1);


score++;

document.getElementById("score")
.innerHTML=
"점수 : "+score;


}


});


});

}





function draw(){


ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);



// 플레이어 비행기

ctx.fillStyle="blue";

ctx.beginPath();

ctx.moveTo(
plane.x,
plane.y-30
);

ctx.lineTo(
plane.x-25,
plane.y+30
);

ctx.lineTo(
plane.x+25,
plane.y+30
);

ctx.closePath();

ctx.fill();




// 총알

ctx.fillStyle="yellow";

bullets.forEach(b=>{

ctx.fillRect(
b.x-3,
b.y,
6,
15
);

});



// 적 비행기

ctx.fillStyle="red";

enemies.forEach(e=>{


ctx.beginPath();

ctx.moveTo(
e.x,
e.y+30
);

ctx.lineTo(
e.x-25,
e.y-20
);

ctx.lineTo(
e.x+25,
e.y-20
);

ctx.closePath();

ctx.fill();


});


}



function gameLoop(){

update();

draw();

requestAnimationFrame(gameLoop);

}


gameLoop();


</script>

</body>
</html>
