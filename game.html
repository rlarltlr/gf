<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="UTF-8">
<title>3D 전투기 슈팅</title>

<style>

body{
    margin:0;
    overflow:hidden;
    background:black;
}

#ui{
    position:absolute;
    top:20px;
    left:20px;
    color:white;
    font-size:25px;
    z-index:10;
    font-family:Arial;
}

</style>

</head>


<body>


<div id="ui">

❤️ HP : <span id="hp">100</span>

<br>

🏆 점수 : <span id="score">0</span>

<br>

🔫 마우스 누르기 : 연사

</div>



<script src="https://cdn.jsdelivr.net/npm/three@0.160/build/three.min.js"></script>


<script>


// ======================
// 기본 설정
// ======================


const scene =
new THREE.Scene();


scene.background =
new THREE.Color(0x66ccff);



const camera =
new THREE.PerspectiveCamera(
70,
window.innerWidth/window.innerHeight,
0.1,
1000
);



const renderer =
new THREE.WebGLRenderer();


renderer.setSize(
window.innerWidth,
window.innerHeight
);


document.body.appendChild(
renderer.domElement
);




// ======================
// 빛
// ======================


const light =
new THREE.DirectionalLight(
0xffffff,
3
);


light.position.set(
0,20,10
);


scene.add(light);





// ======================
// 바닥
// ======================


const ground =
new THREE.Mesh(

new THREE.PlaneGeometry(
300,
300
),

new THREE.MeshPhongMaterial({
color:0x228833
})

);


ground.rotation.x=-Math.PI/2;


scene.add(ground);






// ======================
// 전투기 생성
// ======================


function createPlane(color){


let plane =
new THREE.Group();



// 몸체

let body =
new THREE.Mesh(

new THREE.ConeGeometry(
0.7,
3,
8
),

new THREE.MeshPhongMaterial({
color:color
})

);


body.rotation.x=Math.PI/2;


plane.add(body);




// 날개

let wing =
new THREE.Mesh(

new THREE.BoxGeometry(
3,
0.1,
0.8
),

new THREE.MeshPhongMaterial({
color:color
})

);


plane.add(wing);



// 꼬리

let tail =
new THREE.Mesh(

new THREE.BoxGeometry(
0.3,
0.8,
0.5
),

new THREE.MeshPhongMaterial({
color:color
})

);


tail.position.z=1;


plane.add(tail);



return plane;


}





// ======================
// 플레이어
// ======================


let player =
createPlane(0x00ffff);


scene.add(player);



player.position.set(
0,
3,
10
);




camera.position.set(
0,
6,
15
);


camera.lookAt(
player.position
);







// ======================
// 적
// ======================


let enemies=[];



function createEnemy(){


let enemy =
createPlane(0xff2222);



enemy.position.set(

(Math.random()-0.5)*40,

Math.random()*5+2,

-50

);



scene.add(enemy);


enemies.push(enemy);


}



// 최대 7대

setInterval(()=>{


if(enemies.length < 7){

createEnemy();

}


},2000);








// ======================
// 총알
// ======================


let bullets=[];


let shooting=false;



document.addEventListener(
"mousedown",
()=>{

shooting=true;

});


document.addEventListener(
"mouseup",
()=>{

shooting=false;

});





function shoot(){


let bullet =
new THREE.Mesh(

new THREE.SphereGeometry(
0.08
),

new THREE.MeshBasicMaterial({
color:0xffff00
})

);



bullet.position.copy(
player.position
);


bullet.position.z-=2;



scene.add(bullet);


bullets.push(bullet);


}





// 연사 속도


setInterval(()=>{


if(shooting){

shoot();

}


},120);







// ======================
// 이동
// ======================


let keys={};


document.addEventListener(
"keydown",
e=>{

keys[e.key]=true;

});


document.addEventListener(
"keyup",
e=>{

keys[e.key]=false;

});






let score=0;

let hp=100;







// ======================
// 게임
// ======================


function update(){



// 플레이어 이동


if(keys["ArrowLeft"])

player.position.x-=0.3;



if(keys["ArrowRight"])

player.position.x+=0.3;



if(keys["ArrowUp"])

player.position.y+=0.3;



if(keys["ArrowDown"])

player.position.y-=0.3;






// 총알 이동


bullets.forEach((b,i)=>{


b.position.z-=1;



if(b.position.z<-100){

scene.remove(b);

bullets.splice(i,1);

}



enemies.forEach((e,j)=>{


if(
b.position.distanceTo(e.position)<1
){


scene.remove(e);

scene.remove(b);


enemies.splice(j,1);


bullets.splice(i,1);


score++;


document.getElementById("score")
.innerHTML=score;


}


});


});







// 적 이동


enemies.forEach(e=>{


e.position.z+=0.15;



// 충돌

if(
e.position.distanceTo(player.position)<2
){


hp-=1;


document.getElementById("hp")
.innerHTML=Math.floor(hp);



}


});






if(hp<=0){

alert(
"게임 오버\n점수 : "+score
);


location.reload();

}



}







function animate(){


requestAnimationFrame(
animate
);


update();


renderer.render(
scene,
camera
);


}



animate();



</script>


</body>

</html>
