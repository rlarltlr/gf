<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>FPS 게임 시작</title>

<style>
body{
    margin:0;
    height:100vh;
    background:linear-gradient(#000,#444);
    color:white;
    font-family:Arial;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
}

.box{
    background:#222;
    padding:50px;
    border-radius:20px;
    box-shadow:0 0 30px black;
}

h1{
    font-size:50px;
    color:#ff3300;
}

p{
    font-size:20px;
}

button{
    padding:15px 40px;
    margin:15px;
    border:none;
    border-radius:30px;
    font-size:20px;
    font-weight:bold;
    cursor:pointer;
    background:#ff3300;
    color:white;
}

button:hover{
    background:#ff9900;
    transform:scale(1.1);
}

</style>

</head>

<body>


<div class="box">

<h1>🎮 지진 FPS</h1>

<p>
생존을 위한 전투가 시작된다!
</p>


<a href="main.html">
<button>
게임 시작하기
</button>
</a>


</div>


</body>
</html>
