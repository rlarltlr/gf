<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나만의 여행</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #4facfe, #00f2fe);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
        }

        .box {
            text-align: center;
            background: rgba(0, 0, 0, 0.3);
            padding: 40px;
            border-radius: 15px;
        }

        h1 {
            font-size: 50px;
        }

        p {
            font-size: 20px;
        }

        button {
            padding: 12px 25px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            background: white;
            color: #0077cc;
            cursor: pointer;
        }

        button:hover {
            background: #eeeeee;
        }
    </style>
</head>
<body>

    <div class="box">
        <h1>🌎 나만의 여행</h1>
        <p>새로운 세상을 떠나볼까요?</p>
        <button onclick="alert('즐거운 여행을 시작합니다!')">
            시작하기
        </button>
    </div>

</body>
</html>
