<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>부산 여행</title>

<style>
    body{
        font-family: Arial, sans-serif;
        background-color: #e8f7ff;
        margin:0;
    }

    header{
        background-color: #0099cc;
        color:white;
        text-align:center;
        padding:20px;
    }

    section{
        background:white;
        width:80%;
        margin:20px auto;
        padding:20px;
        border-radius:10px;
    }

    h2{
        color:#0099cc;
    }

    footer{
        background:#333;
        color:white;
        text-align:center;
        padding:10px;
    }
</style>
</head>

<body>

<header>
    <h1>부산 여행 안내</h1>
</header>

<section>
    <h2>추천 장소</h2>
    <ul>
        <li>해운대 해수욕장</li>
        <li>광안리 해수욕장</li>
        <li>감천문화마을</li>
    </ul>

    <h2>추천 음식</h2>
    <ul>
        <li>돼지국밥</li>
        <li>밀면</li>
        <li>회</li>
    </ul>

    <h2>여행 한마디</h2>
    <p>부산은 아름다운 바다와 맛있는 음식이 많은 여행지입니다.</p>
</section>

<footer>
    즐거운 부산 여행!
</footer>

</body>
</html>
