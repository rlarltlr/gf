<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="UTF-8">
<title>TACTICAL FPS</title>

<style>

body{
    margin:0;
    overflow:hidden;
    background:black;
    font-family:Arial;
}


/* HUD */

#hud{

position:absolute;
top:20px;
left:20px;
color:white;
font-size:22px;
z-index:10;

}


#crosshair{

position:absolute;
top:50%;
left:50%;

transform:translate(-50%,-50%);

color:white;
font-size:35px;

z-index:10;

}


#enemyBar{

position:absolute;

top:80px;
left:50%;

transform:translateX(-50%);

width:200px;
height:20px;

background:red;

z-index:10;

}


</style>

</head>


<body>


<div id="hud">

❤️ HP : <span id="hp">100</span>

</div>


<div id="enemyBar"></div>


<div id="crosshair">

+

</div>



<script src="https://cdn.jsdelivr.net/npm/three@0.160/build/three.min.js"></script>


<script>


// =====================
// 기본 설정
// =====================


const scene =
new THREE.Scene();


scene.background =
new THREE.Color(0x87ceeb);



const camera =
new THREE.PerspectiveCamera(

75,

window.innerWidth/window.innerHeight,

0.1,

1000

);



const renderer =
new THREE.WebGLRenderer();


renderer.setSize(

window.innerWidth,

window.innerHeight

);


document.body.appendChild(
renderer.domElement
);




// =====================
// 맵
// =====================


const ground =
new THREE.Mesh(

new THREE.PlaneGeometry(100,100),

new THREE.MeshBasicMaterial({

color:0x555555

})

);


ground.rotation.x=-Math.PI/2;

scene.add(ground);




// =====================
// 캐릭터 생성
// =====================


function createCharacter(color){


let obj =
new THREE.Group();


// 몸

let body =
new THREE.Mesh(

new THREE.BoxGeometry(
1,
1.5,
0.5
),

new THREE.MeshBasicMaterial({

color:color

})

);


body.position.y=1.5;

obj.add(body);



// 머리

let head =
new THREE.Mesh(

new THREE.SphereGeometry(
0.35
),

new THREE.MeshBasicMaterial({

color:0xffcc99

})

);


head.position.y=2.6;

obj.add(head);



// 다리

let leg1 =
new THREE.Mesh(

new THREE.BoxGeometry(
0.25,
1,
0.25
),

new THREE.MeshBasicMaterial({

color:"black"

})

);


leg1.position.set(
-0.25,
0.5,
0
);


obj.add(leg1);


let leg2=leg1.clone();

leg2.position.x=0.25;

obj.add(leg2);



return obj;


}



// =====================
// 플레이어
// =====================


const player =
createCharacter("blue");


scene.add(player);


player.position.y=0;




// =====================
// 적
// =====================


const enemy =
createCharacter("red");


enemy.position.set(

0,

0,

-15

);


scene.add(enemy);



let enemyHP=100;





// =====================
// 카메라
// =====================


camera.position.set(

0,

2,

5

);


player.add(camera);




// =====================
// 이동
// =====================


let keys={};



document.addEventListener(
"keydown",
e=>{

keys[e.key]=true;

});


document.addEventListener(
"keyup",
e=>{

keys[e.key]=false;

});




// =====================
// 마우스 시점
// =====================


let yaw=0;

let pitch=0;



document.body.onclick=()=>{

document.body.requestPointerLock();

};



document.addEventListener(
"mousemove",
e=>{


if(document.pointerLockElement){


yaw-=e.movementX*0.002;

pitch-=e.movementY*0.002;


pitch=Math.max(

-1.5,

Math.min(

1.5,

pitch

)

);


camera.rotation.order="YXZ";


camera.rotation.y=yaw;

camera.rotation.x=pitch;


}

});




// =====================
// 총알
// =====================


let bullets=[];



document.addEventListener(
"mousedown",
()=>{


let bullet =
new THREE.Mesh(

new THREE.SphereGeometry(
0.06
),

new THREE.MeshBasicMaterial({

color:"yellow"

})

);



bullet.position.copy(

camera.getWorldPosition(

new THREE.Vector3()

)

);



let direction =
new THREE.Vector3(
0,
0,
-1
);


direction.applyQuaternion(
camera.quaternion
);



bullet.dir=direction;



scene.add(bullet);



bullets.push(bullet);



});





// =====================
// 게임 루프
// =====================


function animate(){


requestAnimationFrame(
animate
);



// 이동


let speed=0.15;



if(keys["w"])

player.translateZ(-speed);



if(keys["s"])

player.translateZ(speed);



if(keys["a"])

player.translateX(-speed);



if(keys["d"])

player.translateX(speed);





// 적 추적


enemy.lookAt(
player.position
);


enemy.position.lerp(

player.position,

0.001

);





// 총알 이동


bullets.forEach(
(b,index)=>{


b.position.add(

b.dir.clone()
.multiplyScalar(0.8)

);



// 적 충돌


if(

b.position.distanceTo(

enemy.position

)<1

){


enemyHP-=10;



document.getElementById(
"enemyBar"
)
.style.width=
enemyHP*2+"px";



scene.remove(b);



if(enemyHP<=0){

scene.remove(enemy);

alert("적 처치!");

}



}



});




renderer.render(

scene,

camera

);


}



animate();



</script>

</body>
</html>
