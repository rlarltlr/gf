<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>3D FPS Shooter</title>

<style>
body{
    margin:0;
    overflow:hidden;
}

#hp{
    position:absolute;
    color:white;
    font-size:25px;
    top:20px;
    left:20px;
    z-index:2;
}
</style>

</head>

<body>

<div id="hp">
❤️ HP : 100
</div>


<script src="https://cdn.jsdelivr.net/npm/three@0.160/build/three.min.js"></script>


<script>


const scene=new THREE.Scene();

scene.background=new THREE.Color(0x87ceeb);



const camera=new THREE.PerspectiveCamera(
70,
window.innerWidth/window.innerHeight,
0.1,
1000
);



const renderer=new THREE.WebGLRenderer();

renderer.setSize(
window.innerWidth,
window.innerHeight
);

document.body.appendChild(renderer.domElement);



// 바닥

const ground=new THREE.Mesh(

new THREE.PlaneGeometry(100,100),

new THREE.MeshBasicMaterial({
color:0x555555
})

);

ground.rotation.x=-Math.PI/2;

scene.add(ground);




// 사람 캐릭터 만들기

function createCharacter(color){


let body=new THREE.Group();


// 몸

let torso=new THREE.Mesh(

new THREE.BoxGeometry(
1,
1.5,
0.5
),

new THREE.MeshBasicMaterial({
color:color
})

);

torso.position.y=1.5;

body.add(torso);



// 머리

let head=new THREE.Mesh(

new THREE.SphereGeometry(
0.35
),

new THREE.MeshBasicMaterial({
color:0xffcc99
})

);

head.position.y=2.6;

body.add(head);



// 팔

let arm1=new THREE.Mesh(

new THREE.BoxGeometry(
0.2,
1,
0.2
),

new THREE.MeshBasicMaterial({
color:color
})

);

arm1.position.set(
-0.7,
1.5,
0
);

body.add(arm1);



let arm2=arm1.clone();

arm2.position.x=0.7;

body.add(arm2);



// 다리

let leg1=new THREE.Mesh(

new THREE.BoxGeometry(
0.25,
1,
0.25
),

new THREE.MeshBasicMaterial({
color:"black"
})

);

leg1.position.set(
-0.25,
0.5,
0
);

body.add(leg1);


let leg2=leg1.clone();

leg2.position.x=0.25;

body.add(leg2);


return body;

}



// 플레이어

const player=createCharacter("blue");

scene.add(player);



// 적

const enemy=createCharacter("red");

enemy.position.z=-15;

scene.add(enemy);





camera.position.set(
0,
5,
8
);




// 마우스 조준

let mouse=new THREE.Vector2();


window.addEventListener(
"mousemove",
e=>{


mouse.x=
(e.clientX/window.innerWidth)*2-1;


mouse.y=
-(e.clientY/window.innerHeight)*2+1;


});




// 총알

let bullets=[];


window.addEventListener(
"click",
()=>{


let raycaster=
new THREE.Raycaster();


raycaster.setFromCamera(
mouse,
camera
);


let direction=
raycaster.ray.direction.clone();



let bullet=new THREE.Mesh(

new THREE.SphereGeometry(
0.08
),

new THREE.MeshBasicMaterial({
color:"yellow"
})

);



bullet.position.copy(
camera.position
);


bullet.direction=direction;


scene.add(bullet);


bullets.push(bullet);


});




// 이동

let keys={};


document.addEventListener(
"keydown",
e=>keys[e.key]=true
);


document.addEventListener(
"keyup",
e=>keys[e.key]=false
);




// 게임

function animate(){


requestAnimationFrame(animate);



// 이동

if(keys["w"])
player.position.z-=0.1;


if(keys["s"])
player.position.z+=0.1;


if(keys["a"])
player.position.x-=0.1;


if(keys["d"])
player.position.x+=0.1;



// 카메라 따라가기

camera.position.x=
player.position.x;


camera.position.z=
player.position.z+8;


camera.lookAt(
player.position
);



// 적 이동

enemy.lookAt(player.position);

enemy.position.lerp(
player.position,
0.0008
);



// 총알 이동

bullets.forEach(
b=>{

b.position.add(
b.direction.clone().multiplyScalar(0.5)
);


}
);



renderer.render(
scene,
camera
);


}


animate();



</script>

</body>
</html>
