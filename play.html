<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>FPS Game</title>

<style>
body{
    margin:0;
    background:#111;
    color:white;
    text-align:center;
    font-family:Arial;
}

canvas{
    background:#555;
    display:block;
    margin:auto;
}

button{
    padding:12px 25px;
    margin:10px;
    font-size:18px;
}
</style>

</head>

<body>

<h1>🔫 지진 FPS</h1>

<h2>
HP : <span id="hp">100</span>
</h2>


<canvas id="game" width="800" height="500"></canvas>


<button onclick="shoot()">🔫 총쏘기</button>
<button onclick="dash()">💨 돌진</button>


<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");


// 플레이어

let player={
x:400,
y:400,
hp:100
};


// 적

let enemy={
x:400,
y:100,
hp:100
};


// 총알

let bullets=[];


// 키 입력

let keys={};


document.addEventListener("keydown",e=>{
keys[e.key]=true;
});


document.addEventListener("keyup",e=>{
keys[e.key]=false;
});



// 이동

function move(){

if(keys["a"])
player.x-=5;

if(keys["d"])
player.x+=5;


if(keys["w"])
player.y-=5;

if(keys["s"])
player.y+=5;

}



// 총 발사

function shoot(){

bullets.push({

x:player.x,
y:player.y,
speed:8

});

}


// 돌진

function dash(){

player.x+=80;

}



// 게임 업데이트

function update(){


move();


// 총알 이동

bullets.forEach((b,index)=>{

b.y-=b.speed;


// 적 맞음

if(
Math.abs(b.x-enemy.x)<30 &&
Math.abs(b.y-enemy.y)<30
){

enemy.hp-=20;

bullets.splice(index,1);

}

});



// 적 이동

if(enemy.x<player.x)
enemy.x+=1;

else
enemy.x-=1;



// 적 공격

if(
Math.abs(enemy.x-player.x)<50
){

player.hp-=0.2;

document.getElementById("hp").innerHTML=
Math.floor(player.hp);


}



if(player.hp<=0){

alert("게임 오버");

location.reload();

}


}



// 그리기

function draw(){

ctx.clearRect(
0,
0,
800,
500
);


// 적

ctx.font="50px Arial";

ctx.fillText(
"👹",
enemy.x,
enemy.y
);


// 플레이어

ctx.fillText(
"🔫",
player.x,
player.y
);


// 총알

ctx.fillStyle="yellow";

bullets.forEach(b=>{

ctx.beginPath();

ctx.arc(
b.x,
b.y,
5,
0,
Math.PI*2
);

ctx.fill();

});


}



// 반복

function game(){

update();

draw();

requestAnimationFrame(game);

}


game();


</script>

</body>
</html>
