<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>3D FPS Game</title>

<style>
body{
    margin:0;
    overflow:hidden;
    background:black;
}

#info{
    position:absolute;
    top:10px;
    left:10px;
    color:white;
    font-size:20px;
    z-index:2;
}

</style>

</head>

<body>

<div id="info">
WASD 이동 | 마우스 시점 | 클릭 공격
</div>


<script src="https://cdn.jsdelivr.net/npm/three@0.160/build/three.min.js"></script>


<script>


// 장면 생성
const scene = new THREE.Scene();

scene.background = new THREE.Color(0x87ceeb);


// 카메라 (1인칭)
const camera =
new THREE.PerspectiveCamera(
75,
window.innerWidth/window.innerHeight,
0.1,
1000
);


// 렌더러

const renderer =
new THREE.WebGLRenderer();

renderer.setSize(
window.innerWidth,
window.innerHeight
);

document.body.appendChild(renderer.domElement);



// 바닥

const floor =
new THREE.Mesh(

new THREE.PlaneGeometry(100,100),

new THREE.MeshBasicMaterial({
color:0x555555
})

);

floor.rotation.x=-Math.PI/2;

scene.add(floor);



// 플레이어 캐릭터

const player =
new THREE.Mesh(

new THREE.BoxGeometry(
1,
2,
1
),

new THREE.MeshBasicMaterial({
color:"blue"
})

);


player.position.y=1;

scene.add(player);



camera.position.set(
0,
1.7,
0
);


player.add(camera);



// 적 캐릭터

const enemy =
new THREE.Mesh(

new THREE.BoxGeometry(
1,
2,
1
),

new THREE.MeshBasicMaterial({
color:"red"
})

);


enemy.position.set(
0,
1,
-10
);


scene.add(enemy);



// 이동

let keys={};


document.addEventListener(
"keydown",
e=>{
keys[e.key]=true;
});


document.addEventListener(
"keyup",
e=>{
keys[e.key]=false;
});



// 마우스 시점

document.body.onclick=()=>{

document.body.requestPointerLock();

};


let xRotation=0;
let yRotation=0;


document.addEventListener(
"mousemove",
e=>{

if(document.pointerLockElement){

yRotation-=e.movementX*0.002;

xRotation-=e.movementY*0.002;


xRotation=Math.max(
-1.5,
Math.min(1.5,xRotation)
);


camera.rotation.x=xRotation;

player.rotation.y=yRotation;


}

});



// 총알

let bullets=[];


document.addEventListener(
"mousedown",
()=>{


let bullet=
new THREE.Mesh(

new THREE.SphereGeometry(
0.05
),

new THREE.MeshBasicMaterial({
color:"yellow"
})

);


bullet.position.copy(
camera.getWorldPosition(
new THREE.Vector3()
)
);


bullet.direction=
new THREE.Vector3(0,0,-1)
.applyQuaternion(
camera.quaternion
);


scene.add(bullet);

bullets.push(bullet);


});




// 게임 반복

function animate(){


requestAnimationFrame(
animate
);


// 이동

let speed=0.1;


if(keys["w"])
player.translateZ(-speed);


if(keys["s"])
player.translateZ(speed);


if(keys["a"])
player.translateX(-speed);


if(keys["d"])
player.translateX(speed);




// 적 접근

enemy.lookAt(player.position);

enemy.position.lerp(
player.position,
0.0008
);



// 총알 이동

bullets.forEach(
b=>{

b.position.add(
b.direction.multiplyScalar(0.5)
);


}
);



renderer.render(
scene,
camera
);


}


animate();


</script>

</body>
</html>
