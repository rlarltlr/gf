<!DOCTYPE html>

<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>실시간 세계 지진 지도</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>
html, body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial, sans-serif;
}

#map{
    width:100%;
    height:100%;
}

#title{
    position:absolute;
    top:10px;
    left:10px;
    z-index:1000;
    background:rgba(0,0,0,0.75);
    color:white;
    padding:12px 16px;
    border-radius:10px;
    font-size:22px;
}

#status{
    position:absolute;
    top:65px;
    left:10px;
    z-index:1000;
    background:rgba(0,0,0,0.75);
    color:white;
    padding:8px 12px;
    border-radius:8px;
    font-size:14px;
}

#legend{
    position:absolute;
    bottom:15px;
    left:10px;
    z-index:1000;
    background:rgba(0,0,0,0.75);
    color:white;
    padding:10px 12px;
    border-radius:8px;
    font-size:13px;
    line-height:1.6;
}
</style>

</head>

<body>

<div id="title">🌍 실시간 세계 지진 지도 (최근 24시간)</div>
<div id="status">USGS 데이터 연결 중...</div>

<div id="legend">
<b>지진 규모 색상</b><br>
<span style="color:#00ff88">●</span> M 0~2.9<br>
<span style="color:#ffff00">●</span> M 3.0~3.9<br>
<span style="color:#ffaa00">●</span> M 4.0~4.9<br>
<span style="color:#ff6600">●</span> M 5.0~5.9<br>
<span style="color:#ff0000">●</span> M 6.0+
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
const map = L.map('map').setView([20, 0], 2);

// OpenStreetMap 타일
L.tileLayer(
  'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {
    attribution:'© OpenStreetMap contributors',
    maxZoom:18
  }
).addTo(map);

let quakeLayer = L.layerGroup().addTo(map);

async function loadEarthquakes(){

    try{

        const url =
          'https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_day.geojson?t='
          + Date.now();

        const res = await fetch(url, { cache:'no-store' });
        const data = await res.json();

        quakeLayer.clearLayers();

        data.features.forEach(eq => {

            const mag = eq.properties.mag || 0;
            const place = eq.properties.place || '위치 정보 없음';
            const time = new Date(eq.properties.time)
                .toLocaleString('ko-KR');

            const [lon, lat, depth] = eq.geometry.coordinates;

            let color = '#00ff88';
            if(mag >= 6) color = '#ff0000';
            else if(mag >= 5) color = '#ff6600';
            else if(mag >= 4) color = '#ffaa00';
            else if(mag >= 3) color = '#ffff00';

            const radius = Math.max(4, mag * 4);

            L.circleMarker([lat, lon], {
                radius,
                color,
                fillColor: color,
                fillOpacity: 0.75,
                weight:1
            })
            .bindPopup(`
                <b>규모 M ${mag.toFixed(1)}</b><br>
                <b>위치:</b> ${place}<br>
                <b>깊이:</b> ${depth.toFixed(1)} km<br>
                <b>발생:</b> ${time}
            `)
            .addTo(quakeLayer);

        });

        document.getElementById('status').textContent =
          `최근 24시간 지진 ${data.features.length}건 · 마지막 갱신 `
          + new Date().toLocaleTimeString('ko-KR');

    }catch(err){

        console.error(err);

        document.getElementById('status').textContent =
          'USGS 실시간 데이터 연결 실패';

    }

}

// 최초 로드
loadEarthquakes();

// 10초마다 자동 갱신
setInterval(loadEarthquakes, 10000);
</script>

</body>
</html>
