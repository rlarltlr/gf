<!DOCTYPE html>

<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>실시간 세계 지진 모니터</title>

<style>
html, body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#111;
    font-family:Arial, sans-serif;
}

#map{
    position:relative;
    width:100%;
    height:100%;
    background:url('world-map.png') center center / cover no-repeat;
}

#overlay{
    position:absolute;
    inset:0;
}

#title{
    position:absolute;
    top:15px;
    left:15px;
    color:white;
    background:rgba(0,0,0,0.6);
    padding:12px 16px;
    border-radius:12px;
    font-size:22px;
    z-index:10;
}

#status{
    position:absolute;
    top:75px;
    left:15px;
    color:white;
    background:rgba(0,0,0,0.6);
    padding:8px 12px;
    border-radius:10px;
    font-size:14px;
    z-index:10;
}

.quake{
    position:absolute;
    border-radius:50%;
    transform:translate(-50%,-50%);
    animation:pulse 2s infinite;
    pointer-events:auto;
}

@keyframes pulse{
    0%{ transform:translate(-50%,-50%) scale(0.8); opacity:0.9; }
    70%{ transform:translate(-50%,-50%) scale(1.6); opacity:0.25; }
    100%{ transform:translate(-50%,-50%) scale(0.8); opacity:0.9; }
}

#tooltip{
    position:absolute;
    display:none;
    background:rgba(0,0,0,0.85);
    color:white;
    padding:8px 10px;
    border-radius:8px;
    font-size:13px;
    pointer-events:none;
    z-index:20;
    max-width:260px;
}
</style>

</head>

<body>

<div id="map">
    <div id="title">🌍 실시간 세계 지진 (최근 24시간)</div>
    <div id="status">연결 중...</div>
    <div id="overlay"></div>
    <div id="tooltip"></div>
</div>

<script>
const overlay = document.getElementById('overlay');
const tooltip = document.getElementById('tooltip');
const statusEl = document.getElementById('status');

async function loadEarthquakes(){

    try{

        // 캐시 방지용 타임스탬프
        const url =
          'https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_day.geojson?t='
          + Date.now();

        const res = await fetch(url, { cache: 'no-store' });
        const data = await res.json();

        overlay.innerHTML = '';

        const w = overlay.clientWidth;
        const h = overlay.clientHeight;

        data.features.forEach(eq => {

            const mag = eq.properties.mag || 0;
            const place = eq.properties.place || '위치 정보 없음';
            const time = new Date(eq.properties.time).toLocaleString('ko-KR');

            const [lon, lat] = eq.geometry.coordinates;

            // 위도/경도 → 세계지도 좌표
            const x = (lon + 180) / 360 * w;
            const y = (90 - lat) / 180 * h;

            const size = Math.max(4, mag * 3);

            let color = '#00ff88';
            if(mag >= 6) color = '#ff0000';
            else if(mag >= 5) color = '#ff6600';
            else if(mag >= 4) color = '#ffaa00';
            else if(mag >= 3) color = '#ffff00';

            const dot = document.createElement('div');
            dot.className = 'quake';
            dot.style.left = x + 'px';
            dot.style.top = y + 'px';
            dot.style.width = size + 'px';
            dot.style.height = size + 'px';
            dot.style.background = color;
            dot.style.boxShadow = `0 0 ${size*2}px ${color}`;

            dot.addEventListener('mouseenter', e => {
                tooltip.style.display = 'block';
                tooltip.innerHTML =
                  `<strong>M ${mag.toFixed(1)}</strong><br>${place}<br>${time}`;
            });

            dot.addEventListener('mousemove', e => {
                tooltip.style.left = (e.pageX + 15) + 'px';
                tooltip.style.top = (e.pageY + 15) + 'px';
            });

            dot.addEventListener('mouseleave', () => {
                tooltip.style.display = 'none';
            });

            overlay.appendChild(dot);

        });

        statusEl.textContent =
          `최근 24시간 지진 ${data.features.length}건 · 실시간 갱신: `
          + new Date().toLocaleTimeString('ko-KR');

    }catch(err){

        console.error(err);
        statusEl.textContent = 'USGS 실시간 데이터 연결 실패';

    }

}

// 최초 로드
loadEarthquakes();

// 10초마다 실시간 갱신
setInterval(loadEarthquakes, 10000);

// 창 크기 변경 시 다시 배치
window.addEventListener('resize', loadEarthquakes);
</script>

</body>
</html>
